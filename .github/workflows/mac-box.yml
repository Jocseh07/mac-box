name: mac-box

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to keep the Mac open (max 345)
        default: "300"

concurrency: mac-box

jobs:
  box:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Enable SSH for the runner user
        run: |
          mkdir -p ~/.ssh
          cat authorized_keys >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist || sudo systemsetup -setremotelogin on
          echo "SSH user: $(whoami)"

      - name: Join tailnet without touching system DNS
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          brew install tailscale
          sudo nohup "$(brew --prefix)/bin/tailscaled" --state=mem: >/tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=mac-box --accept-dns=false --timeout=2m
          tailscale ip -4
          curl -sSfo /dev/null https://registry.npmjs.org/ && echo "public DNS ok"

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available iOS

      - name: Stay open
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          minutes="$MINUTES"
          [ "$minutes" -gt 345 ] && minutes=345
          echo "Open for $minutes minutes. Cancel the run to close it early."
          sleep $((minutes * 60))
